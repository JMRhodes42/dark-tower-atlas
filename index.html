<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:border-box}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: one dark field. The Tower sits at the center of a radial map; a reading panel rides the right edge (stacks below on phones). Single deliberate dark look: the Crimson King's colors. */
:root{
  color-scheme: dark;
  --void:#0c0708;      /* page ground, warm black */
  --soot:#140b0d;      /* panel */
  --char:#2a181c;      /* rules, borders */
  --bone:#ece2d8;      /* text */
  --dust:#a08f88;      /* secondary text */
  --crimson:#c8183a;   /* canon, the King */
  --rose:#f2667f;      /* the Rose, adaptations, focus */
  --glow:#ff9aa9;
  /* thread hues, kept dusky to sit inside the crimson world */
  --t-flagg:#e8dccf;
  --t-crimson:#e0243f;
  --t-breakers:#f2789a;
  --t-callahan:#d9a64f;
  --t-turtle:#86b5a2;
  --t-derry:#b6b56a;
  --t-doors:#a58ad8;
  --t-flanagan:#9fb0c6;
  --f-display:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-sc:"IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body:"Spectral", "Iowan Old Style", Georgia, serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html,body{height:100%}
body{background:var(--void);color:var(--bone);font-family:var(--f-body);font-size:15px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--char);background:linear-gradient(180deg,#160a0d 0%,var(--void) 100%)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.2vw,34px);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
h1 em{color:var(--crimson);font-style:italic}
.tabs{display:flex;gap:4px;border:1px solid var(--char);border-radius:999px;padding:3px;background:#0f0809}
.tab{background:none;border:0;border-radius:999px;padding:7px 14px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;color:var(--dust)}
.tab[aria-selected="true"]{background:var(--crimson);color:#fff}
.tab:hover:not([aria-selected="true"]){color:var(--bone)}
.tools{display:flex;gap:10px;align-items:center}
.switch{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--dust);background:none;border:0;padding:4px}
.switch .knob{width:34px;height:18px;border-radius:999px;background:var(--char);position:relative;transition:background .2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--dust);transition:transform .2s,background .2s}
.switch[aria-checked="true"] .knob{background:var(--crimson)}
.switch[aria-checked="true"] .knob::after{transform:translateX(16px);background:#fff}
.switch[aria-checked="true"]{color:var(--bone)}
.ghost{background:none;border:1px solid var(--char);border-radius:999px;padding:6px 12px;font-family:var(--f-mono);font-size:12px;color:var(--dust)}
.ghost:hover{color:var(--bone);border-color:var(--dust)}

/* Stage */
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px)}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#1d0b10 0%,#0f0709 45%,var(--void) 75%)}
#map{width:100%;height:100%;display:block;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#map.zoomed{touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--char);background:rgba(12,7,8,.85);font-family:var(--f-mono);font-size:16px;color:var(--bone)}
.zoom button:hover{border-color:var(--dust)}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;max-width:calc(100% - 80px);display:flex;flex-wrap:wrap;gap:6px 14px;font-family:var(--f-mono);font-size:11px;color:var(--dust);background:rgba(12,7,8,.78);padding:8px 10px;border-radius:8px;border:1px solid var(--char);max-width:calc(100% - 24px)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-dot{width:9px;height:9px;border-radius:50%}
.lg-line{width:18px;height:0;border-top:2px solid var(--crimson)}
.lg-dash{width:18px;height:0;border-top:2px dashed var(--dust)}
.lg-dia{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--rose)}

/* Panel */
.panel{border-left:1px solid var(--char);background:var(--soot);overflow-y:auto;min-width:0;padding-block:22px 40px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.panel h3{font-family:var(--f-sc);font-weight:400;font-size:17px;letter-spacing:.03em;margin:0;color:var(--bone)}
.panel p{margin:0;max-width:62ch}
.muted{color:var(--dust)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--char);color:var(--dust)}
.chip.canon{border-color:rgba(200,24,58,.6);color:#ff8b9c}
.chip.echo{border-style:dashed}
.chip.screen{border-color:rgba(242,102,127,.5);color:var(--rose)}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{display:grid;grid-template-columns:18px minmax(0,1fr);gap:4px 12px}
.fact .mark{grid-row:span 2;width:10px;height:10px;margin-top:7px;transform:rotate(45deg);background:var(--crimson)}
.fact b{font-family:var(--f-sc);font-weight:400;font-size:17px}
.fact p{color:#d7cbc1}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--crimson);border:0;border-radius:999px;padding:9px 16px;font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;color:#fff}
.btn.alt{background:none;border:1px solid var(--char);color:var(--bone)}
.btn:hover{filter:brightness(1.12)}
.rule{height:1px;background:var(--char);border:0;margin:0}
.tie{border-left:2px solid var(--crimson);padding-left:12px}
.tie.echo{border-left-style:dashed;border-left-color:var(--dust)}
.tie .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dust);display:block;margin-bottom:2px}
.spoil{position:relative;border:1px solid var(--char);border-radius:10px;padding:12px 14px;background:#100809}
.spoil .lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);display:block;margin-bottom:4px}
.spoil.locked p{filter:blur(6px);user-select:none;-webkit-user-select:none}
.spoil.locked button{position:absolute;inset:0;background:transparent;border:0;border-radius:10px;font-family:var(--f-mono);font-size:12px;color:var(--bone);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
.spoil.locked button span{background:rgba(12,7,8,.9);border:1px solid var(--char);padding:4px 10px;border-radius:999px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.list li{min-width:0}
.item{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:9px 10px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.item:hover{background:#1c1013}
.item .yr{font-family:var(--f-mono);font-size:11px;color:var(--dust);font-variant-numeric:tabular-nums}
.item .ttl{font-family:var(--f-body);font-weight:500}
.item .note{grid-column:2 / 4;color:#cdbfb5;font-size:14px}
.item .note.hidden{color:var(--dust);font-style:italic}
.item .sw{width:10px;height:10px;border-radius:50%;align-self:center}
.threads{display:flex;flex-direction:column;gap:6px}
.thr{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 12px;text-align:left;background:none;border:1px solid var(--char);border-radius:10px;padding:11px 12px}
.thr:hover,.thr[aria-pressed="true"]{border-color:var(--dust);background:#1a0f12}
.thr .sw{width:12px;height:12px;border-radius:50%;margin-top:5px;grid-row:span 2}
.thr b{font-family:var(--f-sc);font-weight:400;font-size:16px}
.thr small{color:var(--dust);font-size:13px}
.origins{display:flex;flex-wrap:wrap;gap:6px}
.origin{background:none;border:1px solid var(--char);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--bone)}
.origin[aria-pressed="true"]{background:var(--crimson);border-color:var(--crimson);color:#fff}
.origin:hover:not([aria-pressed="true"]){border-color:var(--dust)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 12px;position:relative;padding-bottom:16px}
.step::before{content:"";position:absolute;left:14px;top:30px;bottom:0;border-left:1px dashed var(--char)}
.step:last-child::before{display:none}
.step .n{width:30px;height:30px;border-radius:50%;border:1px solid var(--crimson);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:#ff8b9c;grid-row:span 2}
.step:last-child .n{background:var(--crimson);color:#fff}
.step .st{background:none;border:0;padding:0;text-align:left;font-weight:500;font-size:16px}
.step .st:hover{color:var(--rose)}
.step .st .yr{font-family:var(--f-mono);font-size:11px;color:var(--dust);margin-left:6px;font-weight:400}
.step p{color:#d0c3b9;font-size:14px}
.back{align-self:flex-start;background:none;border:0;padding:0;font-family:var(--f-mono);font-size:12px;color:var(--dust)}
.back:hover{color:var(--bone)}
.src{font-size:12px;color:var(--dust)}
.src a{color:var(--dust)}

/* Map styles */
.ring{fill:none;stroke:#3a1c22;stroke-width:1;vector-effect:non-scaling-stroke}
.ring.r0{stroke:#5b1e2a}
.ringlbl{fill:#7c5f5f;font-family:var(--f-mono);letter-spacing:.18em}
.beam{stroke:url(#beamGrad);stroke-width:1.2;vector-effect:non-scaling-stroke}
.web path{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;opacity:.11;transition:opacity .25s}
.web.dim path{opacity:.04}
.hl path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-linecap:round}
.hl path.echo{stroke-dasharray:5 5}
.route path{fill:none;stroke:var(--rose);stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-dasharray:7 6;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-26}}
.node{cursor:pointer;transition:opacity .25s}
.node .dot{transition:r .2s}
.node.tower .dot{fill:var(--rose);filter:url(#glow)}
.node.canon .dot{fill:var(--crimson)}
.node.echo .dot{fill:var(--void);stroke:var(--dust);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node.screen .dot{fill:var(--void);stroke:var(--rose);stroke-width:1.5;vector-effect:non-scaling-stroke}
.node .hit{fill:transparent}
.node .halo{fill:none;stroke:var(--rose);stroke-width:1.5;vector-effect:non-scaling-stroke;opacity:0}
.node.sel .halo{opacity:1;animation:halo 1.8s ease-out infinite}
@keyframes halo{0%{opacity:.9}100%{opacity:0}}
.lbl{fill:var(--bone);font-family:var(--f-body);pointer-events:none;paint-order:stroke;stroke:var(--void);stroke-width:3px;stroke-linejoin:round;transition:opacity .25s}
.lbl.r0{font-family:var(--f-display);fill:#ffd9df}
.lbl.screen{fill:var(--rose);font-style:italic}
.lbl.off{opacity:0}
.faded .node:not(.lit){opacity:.18}
svg:not(.faded) .node.echo,svg:not(.faded) .node.screen{opacity:.45}
svg:not(.faded) .lbl.r2{fill:var(--dust)}
.faded .lbl:not(.lit){opacity:0}
.badge circle{fill:var(--crimson)}
.badge text{fill:#fff;font-family:var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.towerglyph{cursor:pointer}
.towerglyph .body{fill:#1b0b0f;stroke:var(--crimson);stroke-width:1.4;vector-effect:non-scaling-stroke}
.towerglyph .win{fill:var(--glow)}
.towerglyph .rose{fill:var(--rose)}

/* Intro: the map assembles itself, once. Fill mode is backwards so nothing is pinned after it ends. */
.intro .towerglyph .body{animation:drawT 1.6s ease-out backwards}
.intro .towerglyph .win{animation:fadein .5s ease-out backwards;animation-delay:calc(1.2s + var(--d,0s))}
.intro .towerglyph .rose{animation:fadein .8s ease-out 1.5s backwards}
.intro .beam{animation:drawB 1.4s ease-out backwards;animation-delay:calc(1.4s + var(--d,0s))}
.intro .ring{animation:fadein 1s ease-out backwards;animation-delay:var(--d,2s)}
.intro .node,.intro .lbl:not(.off){animation:ignite .7s ease-out backwards;animation-delay:var(--d,2.4s)}
.intro .web{animation:fadein 1.2s ease-out 4.2s backwards}
.intro .ringlbl{animation:fadein 1s ease-out 3.6s backwards}
@keyframes drawT{from{stroke-dasharray:900;stroke-dashoffset:900}to{stroke-dasharray:900;stroke-dashoffset:0}}
@keyframes drawB{from{stroke-dasharray:2400;stroke-dashoffset:2400}to{stroke-dasharray:2400;stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes ignite{0%{opacity:0}60%{opacity:1;filter:brightness(2)}100%{opacity:1}}
.top.introtext h1{animation:titlein 1.8s ease-out backwards}
@keyframes titlein{from{opacity:0;letter-spacing:.2em}}
@media (prefers-reduced-motion: reduce){
  .intro *,.top.introtext h1,.route path,.node.sel .halo{animation:none!important}
}

/* Phones and narrow windows: map on top, panel below, page scrolls */
@media (max-width: 860px){
  body{overflow:auto;display:block;height:auto}
  .stage{display:flex;flex-direction:column}
  .mapwrap{height:min(100vw,600px);flex:none}
  .panel{border-left:0;border-top:1px solid var(--char);overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legend{position:static;margin:8px 12px 0;border:0;background:none;padding:0}
  .mapwrap{display:flex;flex-direction:column}
  #map{flex:1;min-height:0}
  .tools{width:100%;justify-content:space-between}
  .tabs{order:3}
}
@media (max-width: 520px){
  .tab{padding:7px 10px}
  .legend{font-size:10px}
}
</style>

</head>
<body>
<header class="top introtext" id="top">
  <div class="brand">
    <span class="eyebrow">Stephen King · 1970 to 2026</span>
    <h1>Atlas of the <em>Dark Tower</em></h1>
  </div>
  <div class="tabs" role="tablist" aria-label="Ways in">
    <button class="tab" role="tab" id="tab-path" data-mode="path" aria-selected="true">Your path</button>
    <button class="tab" role="tab" id="tab-threads" data-mode="threads" aria-selected="false">Threads</button>
    <button class="tab" role="tab" id="tab-explore" data-mode="explore" aria-selected="false">Explore</button>
  </div>
  <div class="tools">
    <button class="switch" id="spoilers" role="switch" aria-checked="false"><span class="knob" aria-hidden="true"></span>Spoilers</button>
    <button class="ghost" id="replay">Replay intro</button>
  </div>
</header>

<main class="stage">
  <section class="mapwrap" aria-label="Map of the Stephen King universe around the Dark Tower">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" class="intro" role="img" aria-label="Radial map: the Dark Tower at center, Tower books on the inner ring, canon crossovers on the middle ring, thematic echoes on the outer ring.">
      <defs>
        <radialGradient id="beamGrad" gradientUnits="userSpaceOnUse" cx="0" cy="0" r="640">
          <stop offset="0" stop-color="#ff7d92" stop-opacity=".75"/>
          <stop offset=".45" stop-color="#c8183a" stop-opacity=".28"/>
          <stop offset="1" stop-color="#c8183a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="coreGrad" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#c8183a" stop-opacity=".35"/>
          <stop offset="1" stop-color="#c8183a" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zreset" aria-label="Reset view">◎</button>
    </div>
    <div class="legend" aria-label="Legend">
      <span><i class="lg-dot" style="background:var(--rose)"></i>Tower book</span>
      <span><i class="lg-dot" style="background:var(--crimson)"></i>Canon crossover</span>
      <span><i class="lg-dot" style="border:1.5px solid var(--dust)"></i>Echo</span>
      <span><i class="lg-dia"></i>Screen</span>
      <span><i class="lg-line"></i>Confirmed link</span>
      <span><i class="lg-dash"></i>Thematic link</span>
    </div>
  </section>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<script>
(() => {
/* ---------- DATA ---------- */
// ring 0 = Tower cycle, 1 = canon crossover, 2 = echo (thematic, not confirmed by King). kind: book | screen
const WORKS = [
  // The Tower cycle, publication order clockwise from the top
  {id:"gunslinger", t:"The Gunslinger", yr:1982, ring:0, a:0, kind:"book",
   b:"Roland Deschain, the last gunslinger, follows the man in black across a desert in a world that has moved on. Short and strange, and the door to everything else.",
   tie:"King wrote its first line in 1970, at 22, four years before Carrie. It ran as magazine stories from 1978 and became a book in 1982. He revised it in 2003 to fit the ending.",
   sp:"Roland lets Jake fall so he can keep chasing. The man in black reads Roland's future in tarot cards and points him at the Tower."},
  {id:"drawing", t:"The Drawing of the Three", yr:1987, ring:0, a:45, kind:"book",
   b:"Doors stand alone on a beach. Each one opens into our New York, in a different year, and Roland draws his companions through.",
   tie:"The first time Roland's world and ours touch. Every later crossover follows this rule.",
   sp:"Eddie Dean, a heroin addict in 1987, and Odetta Holmes, whose second self is Detta Walker. The third door opens on Jack Mort, the man who pushed Jake."},
  {id:"wastelands", t:"The Waste Lands", yr:1991, ring:0, a:90, kind:"book",
   b:"The ka-tet finds the Path of the Beam, meets the giant bear Shardik, and learns about a rose growing in a Manhattan vacant lot. Ends on a train that loves riddles.",
   tie:"The Beam they follow runs from the Bear to the Turtle. The Turtle is the one from IT.",
   sp:"Jake is pulled back through a door from 1977 New York. The rose in the lot is the Tower's twin on our side of things."},

};

/* ---------- SCALE-AWARE SIZING ---------- */
let ppu = 1; // screen pixels per map unit
function measure(){
  const r = svg.getBoundingClientRect();
  ppu = Math.min(r.width / vb.w, r.height / vb.h) || 1;
}
function applyVB(){
  svg.setAttribute("viewBox",`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  measure(); resize();
  svg.classList.toggle("zoomed", vb.w < BASE.w - 1);
}
function resize(){
  const u = 1/ppu, small = svg.getBoundingClientRect().width < 560;
  WORKS.forEach(w => {
    const g = nodeEls[w.id];
    const rpx = w.kind==="screen" ? 4.5 : w.ring===0 ? 7.5 : w.ring===1 ? 6 : 5.5;
    const dot = g.querySelector(".dot");
    if (w.kind==="screen"){ const s=rpx*u; dot.setAttribute("x",-s); dot.setAttribute("y",-s); dot.setAttribute("width",2*s); dot.setAttribute("height",2*s); }
    else dot.setAttribute("r", rpx*u);
    g.querySelector(".hit").setAttribute("r", Math.max(14, small?18:14)*u);
    g.querySelector(".halo").setAttribute("r", (rpx+5)*u);
    // label
    const t = labelEls[w.id];
    const fpx = w.kind==="screen" ? 11 : w.ring===0 ? 14 : 12.5;
    t.setAttribute("font-size", fpx*u);
    const s = Math.sin(w.a*Math.PI/180), c = -Math.cos(w.a*Math.PI/180);
    const gap = (rpx+6)*u;
    let anchor = "middle", dx = 0, dy = 0;
    if (s > 0.28){ anchor="start"; dx=gap; dy=fpx*0.35*u; }
    else if (s < -0.28){ anchor="end"; dx=-gap; dy=fpx*0.35*u; }
    else { dy = c<0 ? -gap : gap + fpx*0.8*u; }
    t.setAttribute("x", w.x+dx); t.setAttribute("y", w.y+dy); t.setAttribute("text-anchor", anchor);
  });
  document.querySelectorAll(".ringlbl").forEach(t=> t.style.display = ppu < 0.45 ? "none" : "");
  gBadges.querySelectorAll("g").forEach(b => {
    b.querySelector("circle").setAttribute("r", 10*u);
    b.querySelector("text").setAttribute("font-size", 11*u);
  });
  labelVisibility();
}
function labelVisibility(){
  const small = svg.getBoundingClientRect().width < 560;
  const lit = currentLit();
  WORKS.forEach(w => {
    let show;
    if (lit) show = lit.has(w.id);
    else if (w.kind==="screen") show = ppu > 0.95;
    else if (w.ring===0) show = ppu > 0.42;
    else show = !small || ppu > 0.55;
    if (S.sel===w.id || S.hover===w.id) show = true;
    labelEls[w.id].classList.toggle("off", !show);
  });
}

// Direct links for one work: every other member of its threads (echo members only if the work is itself an echo), plus its own screen versions or source book.
function linksOf(id){
  const w = byId[id], self = w.echo || (w.parent && byId[w.parent].echo);
  const out = new Map();
  threadsOf(id).forEach(t => {
    const me = t.m.find(m=>m[0]===id);
    t.m.forEach(m => {
      if (m[0]===id || out.has(m[0])) return;
      const echo = !!(m[3] || me[3]);
      if (echo && !self && m[3]) return;
      out.set(m[0], {color:t.color, echo});
    });
  });
  WORKS.forEach(x => { if (x.parent===id && !out.has(x.id)) out.set(x.id,{color:"var(--rose)",echo:false}); });
  if (w.parent && !out.has(w.parent)) out.set(w.parent,{color:"var(--rose)",echo:false});
  return out;
}
function currentLit(){
  const id = S.hover || (S.mode==="explore" ? S.sel : null);
  if (S.hover && S.hover!=="tower"){ return new Set([S.hover, ...linksOf(S.hover).keys()]); }
  if (S.mode==="path" && S.path){ const p = PATHS.find(p=>p.id===S.path); return new Set(p.s.map(s=>s[0]).filter(x=>x!=="tower")); }
  if (S.mode==="threads" && S.thread && !S.hover){ const t = THREADS.find(t=>t.id===S.thread); return new Set(t.m.map(m=>m[0])); }
  if (id && id!=="tower"){ return new Set([id, ...linksOf(id).keys()]); }
  return null;
}
function drawThread(t){
  for (let i=0;i<t.m.length-1;i++){
    const A=t.m[i], B=t.m[i+1], a=byId[A[0]], b=byId[B[0]];
    el("path",{d:curve(a,b),stroke:t.color,class:(A[3]||B[3])?"echo":""},gHl);
  }
}
function render(){

  Object.entries(labelEls).forEach(([id,t]) => t.classList.toggle("lit", !!lit && lit.has(id)));
  const id = S.hover || (S.mode==="explore" ? S.sel : null);
  if (S.mode==="path" && S.path && !S.hover){
    const p = PATHS.find(p=>p.id===S.path);
    const pts = p.s.map(s=>byId[s[0]]);
    for (let i=0;i<pts.length-1;i++) el("path",{d:curve(pts[i],pts[i+1],0.7)},gRoute);

  } else if (S.mode==="threads" && S.thread && !S.hover){
    drawThread(THREADS.find(t=>t.id===S.thread));
  } else if (id && id!=="tower"){
    const a = byId[id];
    linksOf(id).forEach((v,oid) => el("path",{d:curve(a,byId[oid]),stroke:v.color,class:v.echo?"echo":""},gHl));

/* ---------- ZOOM + PAN ---------- */
function toSvg(cx, cy){ const r=svg.getBoundingClientRect(); const sx=r.width/vb.w, sy=r.height/vb.h, s=Math.min(sx,sy); const ox=(r.width - vb.w*s)/2, oy=(r.height - vb.h*s)/2; return {x: vb.x + (cx - r.left - ox)/s, y: vb.y + (cy - r.top - oy)/s}; }
function zoomAt(f, cx, cy){
  const nw = Math.min(BASE.w, Math.max(BASE.w/6, vb.w*f)); const k = nw/vb.w; if (k===1) return;
  const p = cx==null ? {x:vb.x+vb.w/2, y:vb.y+vb.h/2} : toSvg(cx,cy);
  vb = {x: p.x - (p.x-vb.x)*k, y: p.y - (p.y-vb.y)*k, w: nw, h: vb.h*k};
  clamp(); applyVB();
}
function clamp(){
  if (vb.w >= BASE.w - 0.5){ vb={...BASE}; return; }
  vb.x = Math.min(BASE.x+BASE.w-vb.w, Math.max(BASE.x, vb.x));
  vb.y = Math.min(BASE.y+BASE.h-vb.h, Math.max(BASE.y, vb.y));
}
svg.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(e.deltaY*0.0015), e.clientX, e.clientY); }, {passive:false});
document.getElementById("zin").onclick = () => zoomAt(0.7);
document.getElementById("zout").onclick = () => zoomAt(1/0.7);
document.getElementById("zreset").onclick = () => { vb={...BASE}; applyVB(); };
const ptrs = new Map(); let dragging=false, moved=false, last=null, pinch0=null;
svg.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=false;
  if (ptrs.size===1){ last={x:e.clientX,y:e.clientY}; }
  if (ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0={d:Math.hypot(a.x-b.x,a.y-b.y), w:vb.w}; }
});
svg.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if (ptrs.size===2 && pinch0){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); const target=pinch0.w*pinch0.d/d; zoomAt(target/vb.w,(a.x+b.x)/2,(a.y+b.y)/2); moved=true; return; }
  if (ptrs.size===1 && last && vb.w < BASE.w-1){
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    if (!dragging && Math.hypot(dx,dy)<4) return;
    if (!dragging){ dragging=true; svg.classList.add("dragging"); try{svg.setPointerCapture(e.pointerId);}catch(_){} }
    moved=true; vb.x -= dx/ppu; vb.y -= dy/ppu; last={x:e.clientX,y:e.clientY}; clamp(); applyVB();
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size<2) pinch0=null; if (!ptrs.size){ dragging=false; svg.classList.remove("dragging"); last=null; setTimeout(()=>moved=false,0); } };
svg.addEventListener("pointerup", endPtr); svg.addEventListener("pointercancel", endPtr);
new ResizeObserver(() => { measure(); resize(); }).observe(svg);

/* ---------- INTRO ---------- */
function playIntro(){
  const top = document.getElementById("top");
  svg.classList.remove("intro"); top.classList.remove("introtext");
  void svg.getBoundingClientRect();
  svg.classList.add("intro"); top.classList.add("introtext");
  clearTimeout(introTimer);
  introTimer = setTimeout(() => svg.classList.remove("intro"), 5600);
}
let introTimer = setTimeout(() => svg.classList.remove("intro"), 5600);
document.getElementById("replay").onclick = () => { vb={...BASE}; applyVB(); playIntro(); };

/* ---------- BOOT ---------- */
const startMode = store.get("tower.mode");
if (startMode && ["explore","threads","path"].includes(startMode) && startMode!=="path") setMode(startMode);
applyVB(); renderPanel(); render();
})();
</script>
